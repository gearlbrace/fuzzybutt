[project]
name = "williambutcherbot"
version = "0.1.0"
description = "A Telegram Bot for group management and more."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp~=3.14.3",
    "aiofiles~=23.2.1",
    "ffmpeg-python~=0.2.0",
    "dnspython==2.6.1",
    "future~=1.0.0",
    "motor~=3.6",
    "pillow~=12.3.0",
    "psutil~=5.9.8",
    "pykeyboard~=0.1.5",
    "requests~=2.33.0",
    "speedtest-cli~=2.1.3",
    "TgCrypto~=1.2.5",
    "uvloop~=0.19.0",
    "bs4~=0.0.2",
    "python-dotenv~=1.2.2",
    "pyromod~=3.1.6",
    "telegraph~=2.2.0",
    "pytz~=2024.1",
    "kurigram==2.2.12",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]
