[project]
name = "williambutcherbot"
version = "0.1.0"
description = "A Telegram Bot for group management and more."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp~=3.14.3",
    "aiofiles~=23.2.1",
    "ffmpeg-python~=0.2.0",
    "httpx~=0.28.1",
    "dnspython==2.6.1",
    "future~=1.0.0",
    "motor~=3.6",
    "pillow~=12.3.0",
    "psutil~=5.9.8",
    "pykeyboard~=0.1.5",
    "requests~=2.33.0",
    "speedtest-cli~=2.1.3",
    "TgCrypto~=1.2.5",
    "uvloop~=0.19.0",
    "bs4~=0.0.2",
    "python-dotenv~=1.2.2",
    "pyromod~=3.1.6",
    "telegraph~=2.2.0",
    "pytz~=2024.1",
    "kurigram==2.2.12",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.uv]
# pyromod depends on the real "pyrogram" package from PyPI, which collides
# with kurigram (installs itself under the same "pyrogram" import path) --
# left alone, uv installs both, and whichever's files land last in
# site-packages/pyrogram wins per-file, silently mixing two versions'
# code together (this is what broke session storage). kurigram already
# provides everything pyromod imports as `pyrogram`, so tell the resolver
# to never actually install the real one: the marker is always false.
override-dependencies = ["pyrogram; python_version < '0'"]
